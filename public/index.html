<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swedlines</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 640px; margin: 20vh auto 0; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Swedlines</h1>
  <p>Swedish news headlines, in Swedish and English. Coming soon.</p>
  <p lang="sv">Svenska nyhetsrubriker, på svenska och engelska. Kommer snart.</p>
</main>
</body>
</html>
